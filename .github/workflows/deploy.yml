name: Deploy

# Pushing to `live` publishes. `main` is the working branch and only gets the CI build
# (see ci.yml) — merge or fast-forward `live` when you want what is on `main` to go out.
on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and list what rsync would change, without writing to the server"
        type: boolean
        default: false

# One deploy at a time. A queued run is superseded by a newer one, but a transfer already
# in flight is never cancelled — a half-synced docroot is worse than a stale one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm run build` is `tsc --noEmit && vite build`, so this is the typecheck too.
      # Both VITE_ vars are baked into the public bundle, so they are repo *variables*,
      # not secrets. Either may be unset: the API base falls back to the hardcoded
      # default in src/lib/api/http.ts, and an empty conf pin falls through to the
      # server-resolved list in src/lib/api/league.ts.
      - name: Build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ACTIVE_CONFS: ${{ vars.VITE_ACTIVE_CONFS }}
        run: pnpm run build

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # -rlptz rather than -a: -a implies -og, which needs root on the far side.
      #
      # The deploy user can write inside the docroot but does not own the directories
      # themselves, so utime and chmod on a directory come back EPERM even though every
      # file transfers fine. --omit-dir-times and --no-perms drop those two calls; without
      # them rsync exits 23 and fails the job over an attribute nothing serves. File mtimes
      # are still preserved, which is what rsync's quick-check compares on the next run.
      #
      # --delete-after removes files the build no longer produces, once the new ones have
      # landed. Anything in the docroot that is not build output will be deleted; add
      # --exclude lines below if that ever stops being true.
      #
      # Except /assets/. The hashed chunks are protected from deletion (`P` filter rule:
      # still uploaded, never removed by rsync) and pruned by age in the next step instead.
      # A tab that loaded the previous index.html keeps asking for the previous chunk
      # names, and deleting them the moment a deploy lands turned the next click on that
      # tab into "error loading dynamically imported module": the SPA fallback answered
      # index.html as text/html where a module was expected. Keeping the old build's
      # assets for a week means an open tab keeps working until it reloads on its own.
      # The client also reloads itself once on that failure (src/lib/staleChunk.ts); this
      # is what makes the failure rare enough for that to be a net rather than a crutch.
      - name: Deploy to ${{ secrets.DEPLOY_HOST }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          TARGET: /home/brycen/websites/org/ccsesports/www
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          flags="-rlptzv --omit-dir-times --no-perms --delete-after --human-readable"
          flags="$flags --filter=P_/assets/**"
          if [ "${DRY_RUN:-false}" = "true" ]; then
            flags="$flags --dry-run"
            echo "::notice::Dry run — nothing will be written to $DEPLOY_HOST"
          fi
          rsync $flags \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o IdentitiesOnly=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$TARGET/"

      # Prune chunks from builds older than seven days. rsync -t preserved each file's
      # mtime from the build that produced it, and a chunk the current build still emits
      # was just rewritten with a fresh one, so age here is "how long since a build last
      # needed this file". Seven days is longer than any tab stays open.
      - name: Prune old assets
        if: ${{ inputs.dry_run != true }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          TARGET: /home/brycen/websites/org/ccsesports/www
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "find '$TARGET/assets' -type f -mtime +7 -print -delete"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
