name: CI

# Everything that is not a publish. `pnpm run build` is `tsc --noEmit && vite build`,
# and the typecheck is the part that actually catches things — the phase payload is a
# discriminated union, so an unnarrowed field is a compile error here rather than an
# undefined in the browser.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_ACTIVE_CONFS: ${{ vars.VITE_ACTIVE_CONFS }}
        run: pnpm run build
